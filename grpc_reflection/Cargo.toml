[package]
name = "praeco-reflection"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
description = "Dynamic gRPC Server Reflection HTTP/JSON-to-Protobuf transcoding router, reference Tonic backend, and static test client with payload/connection limits for the Praeco workspace"
readme = "Readme.md"
license.workspace = true
authors.workspace = true
repository.workspace = true

keywords = ["grpc", "reflection", "protobuf", "proxy", "tonic"]
categories = ["network-programming", "web-programming", "development-tools"]

[lints]
workspace = true

[[bin]]
name = "grpc_server"
path = "src/grpc_server.rs"

[[bin]]
name = "grpc_router"
path = "src/router.rs"

[[bin]]
name = "static_client"
path = "src/static_client.rs"

[dependencies]
bytes = { workspace = true }
clap = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["full"] }
hyper-util = { workspace = true, features = ["full"] }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true, features = ["tls-aws-lc"] }
tonic-prost = { workspace = true }
tonic-reflection = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }