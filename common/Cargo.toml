[package]
name = "praeco-common"
version = "0.5.1"
edition.workspace = true
description = "Shared HTTP/TLS client utilities for praeco-rs"
license.workspace = true
authors.workspace = true
repository.workspace = true


keywords = ["praeco", "tls", "jwt", "crypto", "utilities"]
categories = ["cryptography", "authentication", "network-programming"]

[dependencies]
anyhow = { workspace = true }
hyper = { workspace = true, features = ["http1", "http2", "client"] }
hyper-rustls = { workspace = true }
hyper-util = { workspace = true, features = ["tokio", "service", "client-legacy", "http1", "http2"] }
jsonwebtoken = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tracing = { workspace = true }
webpki-roots = { workspace = true }

# Optional runtime test PKI utilities (enabled via `test-pki` feature in dev-dependencies)
rcgen = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[features]
test-pki = ["dep:rcgen", "dep:tempfile", "dep:time"]

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
