[package]
name = "praeco-common"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
description = "Shared TLS/mTLS root-store builders, Hyper HTTP/1.1+HTTP/2 client pools, EdDSA JWT verification, HAProxy PROXY Protocol v2 codecs, and IPv6/IPv4 canonicalization helpers for the Praeco workspace"
readme = "Readme.md"
license.workspace = true
authors.workspace = true
repository.workspace = true


keywords = ["praeco", "tls", "jwt", "crypto", "utilities"]
categories = ["cryptography", "authentication", "network-programming"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true, optional = true }
hyper = { workspace = true, features = ["http1", "http2", "client"], optional = true }
hyper-rustls = { workspace = true, optional = true }
hyper-util = { workspace = true, features = ["tokio", "service", "client-legacy", "http1", "http2"], optional = true }
jsonwebtoken = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-pki-types = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
webpki-roots = { workspace = true, optional = true }
x509-parser = { workspace = true, optional = true }

# Optional runtime test PKI utilities (enabled via `test-pki` feature in dev-dependencies)
rcgen = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
time = { workspace = true, optional = true }

[features]
default = ["client", "crl", "jwt", "tls"]
crl = ["dep:rustls-pki-types", "dep:x509-parser"]
tls = ["dep:anyhow", "dep:rustls", "dep:webpki-roots"]
jwt = ["dep:anyhow", "dep:jsonwebtoken", "dep:serde"]
client = ["tls", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util"]
test-pki = ["dep:rcgen", "dep:tempfile", "dep:time"]

[dev-dependencies]
rcgen = { workspace = true }
tempfile = { workspace = true }
time = { workspace = true }
