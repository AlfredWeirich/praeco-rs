[workspace]
members = [
    "jwt_creator",
    "server",
    "client", 
    "common", 
    "cert_decoder",
    "grpc_reflection", 
    "relay-server",
    "relay-server/test_multiplex",
    "examples/https_web_server",
    "server/examples/aggregate_fanout",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
authors = ["Alfred Weirich"]
repository = "https://github.com/AlfredWeirich/praeco-rs"


keywords = ["grpc", "reverse-proxy", "zero-trust", "mtls", "tunnel"]
categories = ["network-programming", "web-programming", "cryptography", "authentication", "asynchronous"]

[workspace.dependencies]
# Internal workspace crates
common = { package = "praeco-common", version = "0.6.0", path = "common" }

# Async runtime & core utilities
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12", "aws_lc_rs"] }
futures = "0.3"
futures-util = "0.3"
pin-project = "1.1"
bytes = "1.11"

# Networking, HTTP & gRPC
hyper = "1.8"
hyper-util = "0.1"
hyper-rustls = { version = "0.27", default-features = false, features = ["native-tokio", "http1", "http2", "tls12", "logging", "aws-lc-rs"] }
http-body = "1.0"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util", "make", "limit"] }
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tonic = { version = "0.14", features = ["channel", "tls-aws-lc", "tls-webpki-roots"] }
tonic-reflection = { version = "0.14", features = ["server"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
prost = "0.14"
prost-reflect = "0.16"

# QUIC & HTTP/3
quinn = { version = "0.11", default-features = false, features = ["log", "platform-verifier", "runtime-tokio", "rustls-aws-lc-rs", "bloom"] }
h3 = "0.0.8"
h3-quinn = "0.0.10"

# TLS, Cryptography & Auth
rustls = { version = "0.23", features = ["aws_lc_rs"] }
rustls-pki-types = "1.14"
webpki-roots = "1.0"
pem = "3.0"
x509-parser = "0.18"
asn1-rs = "0.7"
tls-parser = "0.12"
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
base64 = "0.23"
sha2 = "0.10"

# Observability & Tracing (OpenTelemetry 0.32 stack)
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.33"
opentelemetry = { version = "0.32", features = ["trace"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", features = ["grpc-tonic"] }
opentelemetry-http = "0.32"

# Serialization & General Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_urlencoded = "0.7"
toml = "1.1"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.24", features = ["v4"] }
regex = "1.12"
glob = "0.3"
arc-swap = "1.9"
rand = "0.10"
num_cpus = "1.17"
dashmap = "6.2"
moka = { version = "0.12", default-features = false, features = ["sync"] }
otp-actor = { version = "0.4", default-features = false }
redis = { version = "1.8", default-features = false, features = ["tokio-rustls-comp", "tls-rustls-webpki-roots", "connection-manager"] }
yamux = "0.14"
matchit = "0.9"
local-ip-address = "0.6"
url = "2.5.9"
urlencoding = "2.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "brotli"] }
mimalloc = { version = "0.1", features = ["v3"] }
socket2 = "0.6"
smallvec = { version = "1.14", features = ["const_generics"] }
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
tempfile = "3.27"
time = "0.3"

[profile.release]
opt-level = 3
lto = true              # Full cross-crate LTO for maximum inlining
codegen-units = 1        # Single codegen unit = best optimization (slower compile)
strip = true             # Strip debug symbols from binary
panic = "unwind"         # Isolate panics to individual Tokio tasks instead of crashing the entire proxy
overflow-checks = true   # Prevent silent integer wrap-around in release builds
# For target-native optimizations (AVX2, AES-NI, etc.), build with:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release

[workspace.lints.rust]
unused_imports = "warn"
dead_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }


