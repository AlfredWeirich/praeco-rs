[package]
name = "praeco-client"
version = "0.5.1"
edition.workspace = true
rust-version.workspace = true
description = "Concurrent HTTP/1.1, HTTP/2, and HTTP/3 (QUIC) mTLS load-testing and diagnostic CLI client for querying Zero-Trust Praeco API Gateways with custom CA verification and OpenTelemetry tracing"
readme = "Readme.md"
license.workspace = true
authors.workspace = true
repository.workspace = true


keywords = ["mtls", "client", "tls", "hyper", "rustls"]
categories = ["network-programming", "cryptography", "authentication"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
common = { workspace = true, default-features = false, features = ["client"] }
futures = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
hyper-util = { workspace = true, features = ["tokio", "service", "client-legacy", "http1", "http2"] }
quinn = { workspace = true }
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# HTTP/3 (QUIC)
h3 = { workspace = true }
h3-quinn = { workspace = true }

[[bin]]
name = "client"
path = "src/mtls_client.rs"
