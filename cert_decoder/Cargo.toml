[package]
name = "praeco-cert-decoder"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
description = "Lightweight PEM X.509 certificate inspection CLI that decodes ASN.1 extensions and custom enterprise OID payloads for Praeco zero-trust RBAC role debugging"
readme = "Readme.md"
license.workspace = true
authors.workspace = true
repository.workspace = true


keywords = ["x509", "certificates", "san", "decoder", "cli"]
categories = ["command-line-utilities", "cryptography"]

[lints]
workspace = true

[dependencies]
asn1-rs = { workspace = true, features = ["bigint"] }
x509-parser = { workspace = true }
