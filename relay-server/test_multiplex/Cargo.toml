[package]
name = "yamux_example"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
yamux = "0.14"
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
futures = "0.3"

[[bin]]
name = "yamux_example_client"
path = "src/bin/client.rs"

[[bin]]
name = "yamux_example_server"
path = "src/bin/server.rs"
