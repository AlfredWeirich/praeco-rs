[package]
name = "praeco-relay-server"
version = "0.4.0"
edition.workspace = true
rust-version.workspace = true
description = "Zero-Trust Layer-4 SNI Relay and Reverse Tunnel Server featuring mTLS SAN authentication, Yamux stream multiplexing, live CRL & certificate expiry enforcement, connection/rate limits, E2EE TLS passthrough, and PROXY Protocol v2"
readme = "README.md"
license.workspace = true
authors.workspace = true
repository.workspace = true

keywords = ["relay", "tunnel", "zero-trust", "mtls", "sni-routing"]
categories = ["network-programming", "cryptography", "authentication", "asynchronous"]

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
common = { workspace = true, default-features = false, features = ["crl"] }
dashmap = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tls-parser = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tokio-util = { workspace = true, features = ["compat"] }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }
x509-parser = { workspace = true }
yamux = { workspace = true }
socket2 = { workspace = true }
mimalloc = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["test-pki"] }
tokio = { workspace = true, features = ["test-util"] }
