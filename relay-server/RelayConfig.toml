# ==========================================
# Network Bindings
# ==========================================

# Control Plane: Die interne Adresse, an der sich die Praeco-Gateways (unsere eigenen 
# Reverse Proxies) per mTLS anmelden, um ihre Tunnel-Verbindungen aufzubauen. 
# Endbenutzer/Clients verbinden sich niemals hierher.
control_plane_addr = "0.0.0.0:7001"

# Data Plane: Der öffentlich erreichbare Entrypoint für Endbenutzer (meist Port 443).
# Das Relay terminiert hier KEIN TLS, sondern liest nur den SNI (Server Name) und leitet
# den rohen TLS-Datenstrom an den passenden Tunnel im Control Plane weiter.
data_plane_addr = "0.0.0.0:443"


# ==========================================
# mTLS Certificates (Control Plane Only)
# ==========================================
# WICHTIG: Diese Zertifikate werden AUSSCHLIESSLICH für die interne Absicherung der 
# Tunnel-Verbindungen auf dem `control_plane_addr` (Port 7001) genutzt. 
# Der öffentliche Traffic auf der `data_plane_addr` nutzt diese Zertifikate nicht.

# CA-Zertifikat, um die Praeco-Gateways (Clients) zu authentifizieren. 
# Nur Gateways, deren Zertifikat von dieser CA ausgestellt wurde, dürfen Tunnel aufbauen.
# WICHTIG: Das hier hinterlegte CA-Zertifikat MUSS die Instanz sein, die das `client_cert_path` 
# Zertifikat im TunnelTest.toml (beim Praeco Gateway) ausgestellt hat.
ca_cert_path = "server_certs/self_signed/relay_ca.pem"

# (Optional) Pfad zu einer Certificate Revocation List (CRL) im PEM Format.
# Wird genutzt, um kompromittierte Gateway-Zertifikate (ausgestellt von der CA oben) abzulehnen.
# crl_path = "server_certs/self_signed/relay_ca.crl.pem"

# Zertifikat und privater Schlüssel des Relay-Servers selbst.
# Damit beweist das Relay gegenüber den Praeco-Gateways seine eigene Identität.
# WICHTIG: Das hier konfigurierte Zertifikat MUSS von der CA ausgestellt worden sein,
# die beim Praeco Gateway (TunnelTest.toml) unter `[Server.tunnel] ca_cert_path` konfiguriert ist.
server_cert_path = "server_certs/self_signed/relay_server.pem"
server_key_path = "server_certs/self_signed/relay_server.key"

# Enable or disable background OpenTelemetry Tracing (Jaeger)
enable_opentelemetry = true
jaeger_endpoint = "http://localhost:4317"
otel_log_level = "info"

# ==========================================
# Connection & Timeout Settings
# ==========================================

# Inaktivitäts-Timeout (Idle Timeout) für Data Plane Client-Verbindungen in Sekunden.
# Verbindungen werden nur getrennt, wenn für diesen Zeitraum weder Upstream noch Downstream Bytes fließen.
# Standard: 1800 (30 Minuten). 0 = Deaktiviert (Verbindung bleibt offen, solange TCP-Keepalive antwortet).
data_plane_idle_timeout_secs = 1800

# TCP-Keepalive Probe-Intervall in Sekunden (Socket-Ebene).
# Ermöglicht dem OS, tote Verbindungen (z.B. abgerissene Mobilfunkverbindungen) automatisch zu bereinigen.
# Standard: 60 Sekunden.
tcp_keepalive_secs = 60

# ==========================================
# Concurrency & DoS Hardening Settings (S-27)
# ==========================================

# Maximale Anzahl gleichzeitiger Verbindungen auf der Data-Plane (Global).
# Standard: 10000
max_concurrent_connections = 10000

# Maximale Anzahl gleichzeitiger Verbindungen pro Client-IP (IPv6 aggregiert auf /64).
# Standard: 100
max_concurrent_connections_per_ip = 100

# Timeout für das vollständige Einlesen des TLS ClientHello in Sekunden.
# Verhindert Slowloris-Angriffe und blockierte Verbindungen bei TCP-Fragmentierung.
# Standard: 10
client_hello_timeout_secs = 10

# Timeout für den internen mTLS-Handshake auf der Control-Plane in Sekunden.
# Standard: 10
control_plane_handshake_timeout_secs = 10

# Maximale Anzahl paralleler Yamux-Streams pro Tunnel.
# Verhindert Flaschenhälse bei hoher Last (Standard: 4096, vorher 512).
max_yamux_streams = 4096

# PROXY-Protocol v2 Unterstützung (Phase 4).
# Wenn true, wird für Praeco-Gateways, die beim REGISTER-Befehl PROXY_V2 aushandeln,
# vor jedem Stream die echte Client-IP (IPv4/IPv6) via binärem HAProxy PROXY-Protocol v2
# an das Gateway übertragen.
# Standard: true
enable_proxy_protocol = true



