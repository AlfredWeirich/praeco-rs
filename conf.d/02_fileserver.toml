[[Server]]
# =============================================================================
# Static File Server for ChatApp Frontend
# =============================================================================
name = "fileserver"
ip = "0.0.0.0"
port = 8080
enabled = true
protocol = "http"
authentication = "None"
service = "StaticFiles"

[Server.StaticFilesParams]
root = "./server/www"
fallback_to_index = true

# Optional: Connection limits across TCP, QUIC, and tunnels (Defaults: 10000 global, 100 per IP)
# [Server.connection_limits]
# max_connections = 10000
# max_connections_per_ip = 100

[Server.Layers]
    enabled = ["Logger", "Cors"]

    [Server.Layers.Cors]
    allowed_origins = ["*"]
    allowed_methods = ["GET", "HEAD"]
