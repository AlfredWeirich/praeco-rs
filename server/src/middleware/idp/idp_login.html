<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Device Authentication</title>
    <!-- Subresource Integrity (SRI) verified library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js" integrity="sha384-Dr98ddmUw2QkdCarNQ+OL7xLty7cSxgR0T7v1tq4UErS/qLV0132sBYTolRAFuOV" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: #1e293b;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --code-color: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 36px;
            text-align: center;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .qr-container {
            background-color: white;
            padding: 16px;
            border-radius: 8px;
            display: inline-block;
            margin-bottom: 18px;
        }

        .session-box {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 14px;
            margin-bottom: 14px;
            text-align: left;
        }

        .session-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .session-id-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .session-id-row code {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.8rem;
            color: #38bdf8;
            word-break: break-all;
            user-select: all;
        }

        .copy-btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background-color 0.2s;
            flex-shrink: 0;
        }

        .copy-btn:hover {
            background-color: #475569;
        }

        .user-code-box {
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            margin-bottom: 20px;
        }

        .user-code-title {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: #94a3b8;
            margin-bottom: 2px;
        }

        .user-code-digits {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--code-color);
        }

        .user-code-note {
            font-size: 0.72rem;
            color: #64748b;
            margin-top: 2px;
        }

        .status {
            font-size: 0.9rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid var(--border-color);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            color: #ef4444;
            display: none;
            margin-top: 20px;
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Device Authentication</h1>
        <p>Scanne den QR-Code mit der ChatApp oder gib die Session-ID manuell ein.</p>
        
        <div class="qr-container">
            <canvas id="qr-code"></canvas>
        </div>

        <div class="session-box" id="session-box">
            <div class="session-title">Session ID (für manuelle Eingabe / Simulator)</div>
            <div class="session-id-row">
                <code id="session-id-text">Lade Session...</code>
                <button type="button" class="copy-btn" id="copy-btn" onclick="copySessionId()">Kopieren</button>
            </div>
        </div>

        <div class="user-code-box" id="user-code-box" style="display: none;">
            <div class="user-code-title">Verification Code</div>
            <div class="user-code-digits" id="user-code-digits">---</div>
            <div class="user-code-note">Optionaler Bestätigungscode (Quishing-Schutz)</div>
        </div>

        <div class="status" id="status-container">
            <div class="spinner"></div>
            <span id="status-text">Warte auf Bestätigung...</span>
        </div>

        <div class="error" id="error-message"></div>
    </div>

    <script>
        function copySessionId() {
            const sid = document.getElementById('session-id-text').textContent;
            if (!sid || sid === 'Lade Session...') return;
            navigator.clipboard.writeText(sid).then(() => {
                const btn = document.getElementById('copy-btn');
                const orig = btn.textContent;
                btn.textContent = 'Kopiert!';
                setTimeout(() => btn.textContent = orig, 1500);
            });
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const errorEl = document.getElementById('error-message');
            const statusEl = document.getElementById('status-container');
            const statusText = document.getElementById('status-text');

            try {
                // 1. Fetch a new session and cryptographic poll secret from the IdP
                const loginRes = await fetch('/auth/login', { 
                    method: 'POST',
                    credentials: 'include'
                });
                if (!loginRes.ok) {
                    if (loginRes.status === 429) {
                        throw new Error("Rate-Limit erreicht. Bitte warte kurz vor einem erneuten Versuch.");
                    }
                    throw new Error("Fehler beim Initialisieren der Login-Sitzung.");
                }
                const data = await loginRes.json();
                const sessionId = data.session;
                const pollSecret = data.poll_secret;
                const userCode = data.user_code;

                // 2. Render the QR code using the session ID
                new QRious({
                    element: document.getElementById('qr-code'),
                    value: sessionId,
                    size: 240,
                    level: 'H'
                });

                // Display Session ID for manual input / Simulator
                document.getElementById('session-id-text').textContent = sessionId;

                // Display verification code
                if (userCode) {
                    const codeBox = document.getElementById('user-code-box');
                    const codeDigits = document.getElementById('user-code-digits');
                    codeDigits.textContent = userCode;
                    codeBox.style.display = 'block';
                }

                // 3. Poll for status confirmation using poll_secret binding
                const pollInterval = setInterval(async () => {
                    try {
                        const statusUrl = '/auth/status?session=' + encodeURIComponent(sessionId) +
                            '&poll_secret=' + encodeURIComponent(pollSecret);
                        const statusRes = await fetch(statusUrl, {
                            credentials: 'include',
                            headers: {
                                'X-Poll-Secret': pollSecret
                            }
                        });
                        
                        if (!statusRes.ok) {
                            if (statusRes.status === 404) {
                                clearInterval(pollInterval);
                                throw new Error("Sitzung abgelaufen. Bitte Seite neu laden.");
                            } else if (statusRes.status === 401) {
                                clearInterval(pollInterval);
                                throw new Error("Nicht autorisierte Statusabfrage.");
                            }
                        } else {
                            const data = await statusRes.json();
                            if (data.status === 'confirmed' && data.redirect) {
                                clearInterval(pollInterval);
                                statusText.textContent = "Login bestätigt!";
                                statusEl.querySelector('.spinner').style.display = 'none';
                                window.location.href = data.redirect;
                                return;
                            }
                        }

                    } catch (e) {
                        clearInterval(pollInterval);
                        statusEl.style.display = 'none';
                        errorEl.style.display = 'block';
                        errorEl.textContent = e.message;
                    }
                }, 1500);

            } catch (err) {
                statusEl.style.display = 'none';
                errorEl.style.display = 'block';
                errorEl.textContent = err.message;
            }
        });
    </script>
</body>
</html>
