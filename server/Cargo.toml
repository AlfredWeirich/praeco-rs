[package]
name = "praeco-rs"
version = "0.4.1"
edition.workspace = true
description = "Ultra-fast API Gateway with mTLS OID authorization and gRPC JSON-transcoding"
license.workspace = true
authors.workspace = true
repository.workspace = true

keywords = ["grpc", "reverse-proxy", "zero-trust", "mtls", "tunnel"]
categories = ["network-programming", "web-programming", "cryptography", "authentication", "asynchronous"]

[dependencies]
# --- Core ---
anyhow = { workspace = true }
thiserror = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
futures-util = { workspace = true }
pin-project = { workspace = true }
common = { workspace = true }

# --- Async Runtime (Tokio) ---
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = { workspace = true, features = ["io", "codec", "compat"] }
tokio-stream = { workspace = true }
tokio-rustls = { workspace = true }
yamux = { workspace = true }
# Optional dependencies for tokio-console (uncomment to debug):
# tokio = { workspace = true, features = ["macros", "rt-multi-thread", "tracing"] }
# console-subscriber = "0.4.1"

# --- HTTP & Networking (Hyper, Tower) ---
hyper = { workspace = true, features = ["http1", "server", "http2", "client"] }
hyper-util = { workspace = true, features = ["tokio", "server-auto", "service", "client-legacy", "http1", "http2"] }
http-body = { workspace = true }
http-body-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
async-compression = { workspace = true }
matchit = { workspace = true }
local-ip-address = { workspace = true }
urlencoding = { workspace = true }
url = { workspace = true }

# --- HTTP/3 & QUIC (Requires git master for Quinn 0.11 support) ---
quinn = { workspace = true }
h3 = { workspace = true }
h3-quinn = { workspace = true }

# --- TLS, Cryptography & Auth ---
rustls = { workspace = true }
rustls-pki-types = { workspace = true }
rustls-pemfile = { workspace = true }
pem = { workspace = true }
x509-parser = { workspace = true }
asn1-rs = { workspace = true, features = ["bigint"] }
jsonwebtoken = { workspace = true }
base64 = { workspace = true }

# --- OpenTelemetry, Tracing & Logging ---
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry-http = { workspace = true }
tracing-opentelemetry = { workspace = true }

# --- gRPC (Tonic & Prost) ---
tonic = { workspace = true }
tonic-reflection = { workspace = true }
tonic-prost = { workspace = true }
prost = { workspace = true }
prost-reflect = { workspace = true, features = ["serde"] }

# --- Serialization & Utilities ---
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
regex = { workspace = true }
glob = { workspace = true }
arc-swap = { workspace = true }
rand = { workspace = true }
num_cpus = { workspace = true }
dashmap = { workspace = true }
mimalloc = { workspace = true }
uuid = { workspace = true }

[[bin]]
name = "praeco-rs"
path = "src/server.rs"
