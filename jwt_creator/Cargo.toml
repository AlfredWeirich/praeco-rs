[package]
name = "praeco-jwt-creator"
version = "0.5.2"
edition.workspace = true
rust-version.workspace = true
description = "CLI developer utility for minting and verifying Ed25519 (EdDSA) JWT token pairs with configurable issuer, audience, subject, enterprise OID claims, and TTLs for Praeco auth testing"
readme = "Readme.md"
license.workspace = true
authors.workspace = true
repository.workspace = true


keywords = ["jwt", "eddsa", "ed25519", "tokens", "cli"]
categories = ["command-line-utilities", "cryptography", "authentication"]

[lints]
workspace = true

[dependencies]
common = { workspace = true, default-features = false, features = ["jwt"] }
uuid = { workspace = true }
